[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
    from = "/api/chat"
    to = "/.netlify/functions/chat"
    status = 200

[[redirects]]
    from = "/api/chat-usage"
    to = "/.netlify/functions/chat-usage"
    status = 200

[[redirects]]
    from = "/api/products"
    to = "/.netlify/functions/products"
    status = 200

[[redirects]]
    from = "/api/catalog"
    to = "/.netlify/functions/catalog"
    status = 200

[[redirects]]
    from = "/api/cart"
    to = "/.netlify/functions/cart"
    status = 200

[[redirects]]
    from = "/api/admin/catalog"
    to = "/.netlify/functions/admin-catalog"
    status = 200

[[redirects]]
    from = "/sitemap.xml"
    to = "/.netlify/functions/sitemap"
    status = 200
    force = true

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
