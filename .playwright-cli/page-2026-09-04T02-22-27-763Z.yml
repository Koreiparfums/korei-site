            - generic [ref=f4e887]: C'est quoi un décant ?
            - generic [ref=f4e888]: 
          - generic: Un décant est un petit flacon (2ml, 5ml ou 10ml) rempli directement depuis le flacon original. C'est le meilleur moyen de découvrir un parfum avant d'investir dans un flacon complet.
        - generic [ref=f4e889]:
          - button "Lettre de Pushkar est-il 100% authentique ? " [ref=f4e890] [cursor=pointer]:
            - generic [ref=f4e891]: Lettre de Pushkar est-il 100% authentique ?
            - generic [ref=f4e892]: 
          - generic: Oui, sans exception. Tous nos parfums proviennent directement des distributeurs officiels ou de maisons agréées — jamais de copies ni de contrefaçons.
        - generic [ref=f4e893]:
          - button "Quel format choisir ? " [ref=f4e894] [cursor=pointer]:
            - generic [ref=f4e895]: Quel format choisir ?
            - generic [ref=f4e896]: 
          - generic: Le 2ml convient pour découvrir la fragrance, le 5ml pour un usage régulier sur plusieurs semaines, et le 10ml pour les coups de cœur que vous voulez pouvoir porter durablement.
        - generic [ref=f4e897]:
          - button "Quels sont les délais de livraison ? " [ref=f4e898] [cursor=pointer]:
            - generic [ref=f4e899]: Quels sont les délais de livraison ?
            - generic [ref=f4e900]: 
          - generic: Vos décants sont préparés à la commande puis expédiés sous 24 à 48h. Un email de suivi vous est envoyé dès l'expédition.
